<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPU command graph · luma.gl GPU Dataframe</title>
    <style>
      body { margin: 0; }
      /* Graph beside the details panel; stacked when there is no room for both. */
      .layout { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
      .layout > aside { border-left: 1px solid #262a36; }
      @media (max-width: 800px) {
        /* The graph gets most of a phone screen; the details panel scrolls. */
        .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 28%; }
        .layout > aside { border-left: none; border-top: 1px solid #262a36; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
